### Automatically merged into `docker-compose.yaml` by `docker compose` when
### no `-f` flags are passed -- this is what makes `docker compose up --build`
### keep building from the Dockerfiles for local dev. CI sets
### COMPOSE_FILE=docker-compose.yaml to skip this file and pull the
### prebuilt images instead (see `.github/workflows/e2e-tests.yml`).
services:
    wordcamp.test:
        build:
            context: .docker
            dockerfile: Dockerfile.php-fpm

    wordcamp.db:
        build:
            context: .docker
            dockerfile: Dockerfile.mariadb
