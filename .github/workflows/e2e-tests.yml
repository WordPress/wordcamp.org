name: E2E Tests (Groups/GatherPress)

# Runs on PRs that touch the Groups/GatherPress front end, plus manual
# dispatch for ad-hoc runs. Scoped to these paths (rather than every PR)
# because this stands up real docker-based provisioning (WordPress core
# checkout, TLS cert, DB import, third-party plugin install).
on:
  pull_request:
    paths:
    - public_html/wp-content/mu-plugins/wporg-groups-frontend/**
    - public_html/wp-content/mu-plugins/groups/**
    - tests/e2e/**
    - playwright.config.js
    - .github/workflows/e2e-tests.yml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Playwright E2E

    runs-on: ubuntu-latest

    env:
      # Every `docker compose` call in this job should see only the base
      # file -- not docker-compose.override.yml, which is what makes local
      # dev's `docker compose up --build` rebuild from Dockerfile.php-fpm.
      COMPOSE_FILE: docker-compose.yaml

    steps:
    - uses: actions/checkout@v4

    - name: Install SVN
      # A composer dependency uses --prefer-source, which needs svn on PATH.
      run: |
        sudo rm -f /var/lib/man-db/auto-update # https://github.com/actions/runner-images/issues/10977
        sudo apt-get update && sudo apt-get install -y subversion

    - name: Set PHP version
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
        tools: composer:v2
      env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'composer-dev.json') }}
        restore-keys: |
          composer-${{ runner.os }}-

    - name: Install PHP dependencies
      # wporg-mu-plugins (installed via composer, then moved into place by a
      # post-install script — see composer-dev.json's installer-paths) is loaded
      # unconditionally by load-other-mu-plugins.php; without it every
      # request, including wp-cli, fatals.
      run: |
        rm composer.lock || true
        composer install

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm

    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          public_html/wp-content/**/node_modules
        # Includes package.json (root + every workspace), not just the
        # lockfile: a manifest edited without a matching lockfile update
        # must invalidate the cache too, so `npm ci` runs and rejects the
        # mismatch instead of a stale cache hit silently skipping install
        # (and any changed lifecycle scripts) entirely.
        key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'package.json', 'public_html/wp-content/**/package.json') }}

    - name: Install dependencies
      run: |
        if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" != 'true' ]; then
          npm ci --no-audit --no-fund
        fi

    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      # On a cache hit the browser binaries are already present, but the
      # runner's OS-level deps (apt packages) still need installing --
      # `install-deps` alone skips the (slow) browser download.
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Build all workspace assets
      # The site fatals on boot (including for wp-cli) if any mu-plugin's
      # built assets are missing — not just wporg-groups-frontend's — so
      # build every workspace, same as `npm run setup` does for local dev.
      run: npm run build

    - name: Download WordPress core (latest stable) into public_html/mu
      # Was a fresh `develop trunk` clone -- bleeding-edge core can (and
      # did) drift ahead of the plugins pinned in composer-dev.json. E.g.
      # WP_Icons_Registry landed in trunk with a public register() method
      # before Gutenberg's stable release updated its override to match,
      # producing a "must be public" PHP fatal on every run. Latest stable
      # is what GatherPress/Gutenberg's stable releases actually target.
      run: |
        curl -sL https://wordpress.org/latest.zip -o /tmp/wordpress.zip
        unzip -q /tmp/wordpress.zip -d /tmp
        mv /tmp/wordpress public_html/mu

    - name: Lowercase the image repository path
      # GHCR requires lowercase image references; github.repository
      # preserves the repo's actual casing (WordPress/wordcamp.org).
      id: image
      run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Boot the docker environment
      # Pulls the prebuilt images published by e2e-image.yml instead of
      # rebuilding wordcamp.test/wordcamp.db from their Dockerfiles (the
      # former does apt-get + PHP extension compilation) on every run --
      # see that workflow for the image builds, including the baked-in TLS
      # cert for local hostnames.
      env:
        WORDCAMP_TEST_IMAGE: ghcr.io/${{ steps.image.outputs.repo }}/e2e-php-fpm:latest
        WORDCAMP_DB_IMAGE: ghcr.io/${{ steps.image.outputs.repo }}/e2e-mariadb:latest
      run: docker compose up -d

    - name: Wait for the site to respond
      run: |
        # Don't swallow stderr here — a real (non-timing) failure needs to
        # be visible in the log, not silently retried for the full timeout.
        for i in $(seq 1 20); do
          if docker compose exec -T wordcamp.test wp core is-installed; then
            exit 0
          fi
          echo "Attempt $i/20 failed, retrying in 3s..."
          sleep 3
        done
        echo "WordPress did not become ready in time" >&2
        echo "::group::docker compose logs"
        docker compose logs
        echo "::endgroup::"
        exit 1

    - name: Add local hostnames to /etc/hosts
      run: |
        echo "127.0.0.1 wordcamp.test central.wordcamp.test seattle.wordcamp.test shinynew.wordcamp.test events.wordpress.test" | sudo tee -a /etc/hosts

    - name: Install GatherPress on the groups site
      run: |
        docker compose exec -T wordcamp.test wp plugin install \
          https://github.com/GatherPress/gatherpress/releases/download/0.35.0/gatherpress.0.35.0.zip \
          --activate --url=events.wordpress.test/group/sunshine-coast-qld/

    - name: Create role-tier test users
      # Users are independent rows (different usernames), so creating them
      # concurrently is safe -- backgrounded rather than sequential to avoid
      # paying `docker compose exec`'s per-call overhead 7 times over.
      run: |
        SITE_URL=events.wordpress.test/group/sunshine-coast-qld/
        create_user() {
          if docker compose exec -T wordcamp.test wp user get "$1" --field=ID --url="$SITE_URL" >/dev/null 2>&1; then
            echo "User $1 already exists."
            return 0
          fi
          docker compose exec -T wordcamp.test wp user create "$1" "$1@example.test" \
            --role="$2" --user_pass=password --url="$SITE_URL"
        }
        pids=()
        create_user organiser1 editor & pids+=( "$!" )
        create_user eventorganiser1 author & pids+=( "$!" )
        # Dedicated per-spec accounts, not a shared eventorganiser1, for
        # every spec that logs in as an author and can run concurrently
        # under fullyParallel — this environment only supports one active
        # session per user, so sharing an account risks one worker's login
        # invalidating another's already-established session mid-test (see
        # the comment in tests/e2e/utils/login.js). event-manage-messaging.spec.js
        # needs THREE of its own (eventorganiser2/4/5) since its own three
        # tests also run concurrently against each other.
        create_user eventorganiser2 author & pids+=( "$!" )
        create_user eventorganiser3 author & pids+=( "$!" )
        create_user eventorganiser4 author & pids+=( "$!" )
        create_user eventorganiser5 author & pids+=( "$!" )
        create_user member1 subscriber & pids+=( "$!" )
        status=0
        for pid in "${pids[@]}"; do
          wait "$pid" || status=1
        done
        exit "$status"

    - name: Create required pages
      # `page-members.html` (public_html/wp-content/themes/groups-site/templates/)
      # is a block-theme template keyed on the page slug — it ignores
      # post_content entirely, but only applies once a published Page with
      # that slug actually exists. Not part of the wordcamp_dev.sql fixture.
      run: |
        SITE_URL=events.wordpress.test/group/sunshine-coast-qld/
        create_page() {
          if docker compose exec -T wordcamp.test wp post list --post_type=page --name="$1" --field=ID --url="$SITE_URL" | grep -q .; then
            echo "Page '$1' already exists."
            return 0
          fi
          docker compose exec -T wordcamp.test wp post create --post_type=page \
            --post_title="$2" --post_name="$1" --post_status=publish --url="$SITE_URL"
        }
        create_page members Members

    - name: Run Playwright tests
      # TEMPORARY (wordcamp.org#1883): samples memory/process state every 5s
      # while the suite runs, to test the theory that intermittent
      # "context or browser has been closed" / timeout flakes are caused by
      # CI-runner resource pressure (e.g. Chromium OOM kills) rather than a
      # bug in any one spec. Remove once #1883 is diagnosed either way.
      run: |
        set +e
        ( while true; do
            echo "=== $(date -u +%H:%M:%S) ==="
            free -h
            echo "--- docker stats ---"
            docker stats --no-stream
            echo "--- top memory consumers (host) ---"
            ps aux --sort=-%mem | head -15
            echo "--- top memory consumers (wordcamp.test) ---"
            docker compose exec -T wordcamp.test sh -c "ps aux --sort=-%mem | head -10" 2>/dev/null
            sleep 5
          done ) > /tmp/resource-monitor.log 2>&1 &
        monitor_pid=$!
        npx playwright test
        test_exit=$?
        kill "$monitor_pid" 2>/dev/null
        wait "$monitor_pid" 2>/dev/null
        exit "$test_exit"

    - name: Upload resource monitor log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: resource-monitor-log
        path: /tmp/resource-monitor.log
        retention-days: 14

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload Playwright traces
      # `playwright-report/` above is consistently empty -- the `github`
      # reporter (see playwright.config.js) doesn't produce an HTML report
      # there. `trace: 'on-first-retry'` traces actually land in Playwright's
      # default `test-results/` output dir instead, and were never
      # uploaded -- meaning every flaky/failed run to date had no trace
      # artifact to actually inspect (network, console, DOM snapshots at
      # the moment of failure), for #1883.
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 14
