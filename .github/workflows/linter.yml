name: Static Analysis (Linting)

# Run on changes to public_html and to the dependencies and configs the linters read.
on:
  pull_request:
    paths:
    - public_html/**
    - .github/workflows/**
    - .github/bin/**
    - .nvmrc
    - package.json
    - package-lock.json
    - composer.json
    - composer-dev.json
    - phpcs.xml.dist
    - eslint.config.cjs
    - .prettierrc.js
    - .stylelintrc
  push:
    branches: [production]
    paths:
    - public_html/**
    - .github/workflows/**
    - .github/bin/**
    - .nvmrc
    - package.json
    - package-lock.json
    - composer.json
    - composer-dev.json
    - phpcs.xml.dist
    - eslint.config.cjs
    - .prettierrc.js
    - .stylelintrc

# PHP lint only checks each push's own changes, so a newer push must not cancel an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  check:
    name: All

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Set PHP version
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        tools: composer:v2
      env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'composer-dev.json') }}
        restore-keys: |
          composer-${{ runner.os }}-

    - name: composer install
      # The lock file is removed so that the latest wporg-mu-plugins dev-build is always installed.
      run: |
        rm composer.lock || true
        composer install

    - name: Hash the workspace manifests
      id: npm-manifests
      # Only the workspaces in package.json. A recursive glob also matches third-party plugins that Composer or
      # GatherPress add before this step, so jobs with the same npm inputs would get different cache keys.
      # Assigned first so a jq error fails the step, unquoted so Bash expands globs like routes/*, and pipefail so
      # a manifest that can't be read fails the step instead of being left out of the hash.
      run: |
        set -o pipefail
        manifests=$( jq -r '.workspaces[] + "/package.json"' package.json )
        hash=$( sha256sum $manifests | sha256sum | cut -d' ' -f1 )
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          public_html/wp-content/**/node_modules
        # Includes the manifests, so a package.json edit without a lockfile update reaches `npm ci`, which rejects it.
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'package.json') }}-${{ steps.npm-manifests.outputs.hash }}

    - name: npm install and build
      run: |
        if [ "${{ steps.node-modules-cache.outputs.cache-hit }}" != 'true' ]; then
          npm ci --no-audit --no-fund
        fi
        npm run build --workspaces --if-present

    - name: Lint JavaScript and Styles
      run: |
        npm run lint:js --workspaces --if-present
        npm run lint:css --workspaces --if-present

    - name: Lint styles not covered by an npm workspace
      # `groups-site` and `gatherpress-recurring-events` are plain CSS with
      # no other build/lint tooling need, so they're not registered as npm
      # workspaces — the step above never reaches them. `stylelint` itself
      # is still available here, hoisted to the root node_modules by one of
      # the actual workspaces' `@wordpress/scripts` dependency.
      run: |
        npx stylelint \
          'public_html/wp-content/themes/groups-site/assets/css/*.css' \
          'public_html/wp-content/mu-plugins/gatherpress-recurring-events/assets/*.css'

    - name: Lint PHP
      env:
        # `github.base_ref` is only set on pull requests; a push compares against the commit before it.
        BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
      run: |
        # Lint a one-line file even when no PHP file changed, so a broken phpcs.xml.dist fails. Listing the sniffs
        # with `-e` isn't enough: some bad settings only fail once a file is checked.
        echo '<?php' | public_html/wp-content/mu-plugins/vendor/bin/phpcs --standard=./phpcs.xml.dist -q -
        php .github/bin/phpcs-branch.php
